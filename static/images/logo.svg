<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F2B48" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Eye Graphic -->
  <g transform="translate(10, 10)">
    <!-- Outer Eye Outline -->
    <path d="M 10 40 Q 45 5 80 40 Q 45 75 10 40 Z" fill="none" stroke="url(#eyeGrad)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Retinal Iris / Circle -->
    <circle cx="45" cy="40" r="18" fill="#F8FAFC" stroke="#0D9488" stroke-width="3" />
    
    <!-- Pupil / Lens Core -->
    <circle cx="45" cy="40" r="9" fill="url(#lensGrad)" />
    
    <!-- Crosshair Target lines -->
    <line x1="45" y1="18" x2="45" y2="26" stroke="#0F2B48" stroke-width="2" stroke-linecap="round" />
    <line x1="45" y1="54" x2="45" y2="62" stroke="#0F2B48" stroke-width="2" stroke-linecap="round" />
    <line x1="23" y1="40" x2="31" y2="40" stroke="#0F2B48" stroke-width="2" stroke-linecap="round" />
    <line x1="59" y1="40" x2="67" y2="40" stroke="#0F2B48" stroke-width="2" stroke-linecap="round" />
    
    <!-- Micro Saliency Spark -->
    <circle cx="58" cy="27" r="3" fill="#F59E0B" />
  </g>

  <!-- Typography -->
  <!-- "DR VISION" -->
  <text x="105" y="47" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0F2B48" letter-spacing="0.5">DR VISION</text>
  <!-- "AI" Highlight Badge -->
  <rect x="260" y="24" width="42" height="26" rx="6" fill="#0D9488" />
  <text x="281" y="43" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI</text>
  
  <!-- Subtitle -->
  <text x="106" y="68" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.2">RURAL TELE-OPHTHALMOLOGY</text>
</svg>
